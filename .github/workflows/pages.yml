name: Deploy academy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check scripts
        run: for f in assets/js/*.js assets/js/content/*.js assets/i18n/fa/*.js tools/*.js; do node --check "$f"; done
      - name: Check every text exists in English and Persian
        run: node tools/i18n.js check
      - name: Build the single-file offline edition
        run: python3 tools/build_single.py
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html assets source dist _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
